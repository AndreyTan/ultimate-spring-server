# GraphQL будет работать на стандартном HTTP порту
server:
  port: 8081

# gRPC сервер будет слушать свой собственный порт
grpc:
  server:
    port: 9090

spring:
  datasource:
    url: jdbc:sqlite:./data/orders.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  graphql:
    schema:
      locations: classpath:graphql/**
    graphiql:
      enabled: true

logging:
  level:
    org.springframework.graphql: DEBUG
    org.hibernate.SQL: DEBUG
    org.example: DEBUG